[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "filebin"
version = "1.0.0"
description = "Async Python client and CLI for the Filebin.net API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }

authors = [
  { name = "Aaron Fredrick", email = "Aaron_Fredrick@proton.me" },
]

keywords = ["filebin", "api", "async", "file-upload", "file-sharing", "client"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "aiohttp>=3.10",
]


[project.optional-dependencies]
qr = [
  "Pillow>=10.0",
]
cli-pretty = [
  "rich>=13.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "twine>=5.0",
  "mkdocs>=1.5",
  "mkdocs-material>=9.0",
  "mkdocstrings[python]>=0.25",
]


[project.scripts]
fbin = "filebin.cli.main:entry_point"


[project.urls]
Homepage = "https://github.com/aaron-fredrick/filebin"
Repository = "https://github.com/aaron-fredrick/filebin"
Issues = "https://github.com/aaron-fredrick/filebin/issues"
Documentation = "https://aaron-fredrick.github.io/filebin/"
Changelog = "https://github.com/aaron-fredrick/filebin/releases"


[tool.hatch.build.targets.wheel]
packages = ["filebin"]


[dependency-groups]
dev = []


[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "unit: fast, fully mocked, no I/O",
  "integration: real Filebin.net API calls",
  "cli: subprocess CLI invocation tests",
  "network: any test requiring live network (superset of integration)",
  "slow: tests taking more than 5 seconds",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:aiohttp",
]


[tool.coverage.run]
source = ["filebin"]
omit = [
  "filebin/cli/*",
  "filebin/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
show_missing = true
fail_under = 80


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "S", "I", "UP", "B", "C4", "PTH"]
ignore = [
  "S101",   # assert in tests is fine
  "S603",   # subprocess in CLI tests is fine
  "S607",   # partial path in subprocess is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
