name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Build Package
        run: uv build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Typecheck (Mypy)
        run: uv run mypy filebin/ --strict

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Security (Bandit)
        run: uv run bandit -r filebin/ -ll

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Test (Unit & CLI)
        run: uv run pytest -m "unit or cli" -v --cov=filebin --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
      - name: Test (Integration)
        if: ${{ env.FILEBIN_INTEGRATION == '1' }}
        run: uv run pytest -m network -v
        env:
          FILEBIN_INTEGRATION: ${{ secrets.FILEBIN_INTEGRATION }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  publish-testpypi:
    needs: [build, lint, static, security, codeql, test]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/filebin

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate TestPyPI version
        run: |
          python << 'EOF'
          import re
          import tomllib
          from pathlib import Path
          import os

          pyproject = Path("pyproject.toml")

          with pyproject.open("rb") as f:
              data = tomllib.load(f)

          base_version = data["project"]["version"]
          short_sha = os.environ["GITHUB_SHA"][:7]

          # convert hex sha → decimal string
          sha_decimal = str(int(short_sha, 16))

          # check if already a dev version
          is_dev = ".dev" in base_version

          if is_dev:
              # strip nothing, just append sha
              dynamic_version = f"{base_version}{sha_decimal}"
          else:
              # inject dev segment
              dynamic_version = f"{base_version}.dev{sha_decimal}"

          text = pyproject.read_text(encoding="utf-8")

          text = re.sub(
              r'version\s*=\s*"[^"]+"',
              f'version = "{dynamic_version}"',
              text,
              count=1,
          )

          pyproject.write_text(text, encoding="utf-8")

          print(f"Using version: {dynamic_version}")
          EOF

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
